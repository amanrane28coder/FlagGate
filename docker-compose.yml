# FlagGate — one-command Flagsmith for the demo.
# Sanitized copy of the official Flagsmith compose
# (https://docs.flagsmith.com/deployment/docker): same services, same
# ports (8002 API/frontend, 8001 task processor), experimentation on.
# Replace EVERY CHANGE-ME value before first run; never commit real
# secrets. After `docker compose up -d`, the admin, project and flag
# steps in the README are still manual browser steps.

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgres://postgres:CHANGE-ME@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true' # Store API and Flag Analytics data in Postgres
  ENVIRONMENT: production # set to 'production' in production.
  DJANGO_ALLOWED_HOSTS: '*' # Change this in production
  FLAGSMITH_DOMAIN: localhost:8002 # Change this in production
  DJANGO_SECRET_KEY: CHANGE-ME # Change this in production
  WAREHOUSE_CREDENTIALS_SECRET: CHANGE-ME
  TASK_RUN_METHOD: TASK_PROCESSOR # other options: SYNCHRONOUSLY, SEPARATE_THREAD
  PROMETHEUS_ENABLED: 'true'
  # Lets you try out experimentation by storing SDK events in Postgres.
  # For production, connect a dedicated warehouse.
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: CHANGE-ME
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - 8002:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  # Only needed if TASK_RUN_METHOD is TASK_PROCESSOR (see above).
  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    environment:
      <<: *flagsmith-env
    ports:
      - 8001:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor
